name: Build and Deploy Node.js App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/my-node-app:${{ github.sha }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/my-node-app:latest" .

          docker push "${{ secrets.DOCKERHUB_USERNAME }}/my-node-app:${{ github.sha }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/my-node-app:latest"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "ubuntu@$EC2_HOST" \
            "DOCKER_USER='$DOCKER_USER' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -eu

          IMAGE="$DOCKER_USER/my-node-app:$IMAGE_TAG"

          sudo docker pull "$IMAGE"

          sudo docker stop my-node-app || true
          sudo docker rm my-node-app || true

          sudo docker run -d \
            --name my-node-app \
            --restart unless-stopped \
            -p 80:3000 \
            "$IMAGE"

          sudo docker image prune -f
          REMOTE