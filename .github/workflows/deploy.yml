name: Build and Deploy Node.js App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$DOCKER_USER/my-node-app:$IMAGE_TAG" \
            -t "$DOCKER_USER/my-node-app:latest" .

          docker push "$DOCKER_USER/my-node-app:$IMAGE_TAG"
          docker push "$DOCKER_USER/my-node-app:latest"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USER,IMAGE_TAG
          script: |
            set -eu

            IMAGE="$DOCKER_USER/my-node-app:$IMAGE_TAG"

            
            sudo docker pull "$IMAGE"

            sudo docker stop my-node-app || true
            sudo docker rm my-node-app || true

            sudo docker run -d \
              --name my-node-app \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              "$IMAGE"

            sudo docker image prune -f

